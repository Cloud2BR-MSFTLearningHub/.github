name: Update Repository Metadata

on:
  workflow_call:
    secrets:
      TRAFFIC_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README footer metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.TRAFFIC_TOKEN || process.env.GITHUB_TOKEN;
          const today = new Date().toISOString().slice(0, 10);
          const files = ['README.md', 'profile/README.md'].filter(fs.existsSync);

          async function getTraffic() {
            const response = await fetch(`https://api.github.com/repos/${repository}/traffic/views`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!response.ok) {
              console.warn(`Traffic API request failed with ${response.status}; retaining the current view count.`);
              return null;
            }
            const traffic = await response.json();
            if (!Number.isInteger(traffic.count)) {
              console.warn('Traffic API response did not include a numeric total view count; retaining the current view count.');
              return null;
            }
            return traffic;
          }

          function getExistingViewCount() {
            for (const file of files) {
              const match = fs.readFileSync(file, 'utf8').match(/Total%20views-(\d+)-/);
              if (match) return Number(match[1]);
            }
            return 0;
          }

          function updateReadme(file, totalViews) {
            let text = fs.readFileSync(file, 'utf8');
            const newline = text.includes('\r\n') ? '\r\n' : '\n';
            const badge = [
              '<!-- START BADGE -->',
              '<div align="center">',
              `  <img src="https://img.shields.io/badge/Total%20views-${totalViews}-0A66C2" alt="Total views">`,
              `  <p>Refresh Date: ${today}</p>`,
              '</div>',
              '<!-- END BADGE -->'
            ].join(newline);

            if (file === 'README.md') {
              if (/^Last updated: \d{4}-\d{2}-\d{2}$/m.test(text)) {
                text = text.replace(/^Last updated: \d{4}-\d{2}-\d{2}$/m, `Last updated: ${today}`);
              }
            } else {
              text = text.replace(/^Last updated: \d{4}-\d{2}-\d{2}\r?\n\r?\n?/m, '');
            }

            if (/<!-- START BADGE -->[\s\S]*?<!-- END BADGE -->/.test(text)) {
              text = text.replace(/<!-- START BADGE -->[\s\S]*?<!-- END BADGE -->/, badge);
            } else {
              text = `${text.trimEnd()}${newline}${newline}${badge}${newline}`;
            }
            fs.writeFileSync(file, text, 'utf8');
          }

          (async () => {
            const traffic = await getTraffic();
            const totalViews = traffic?.count ?? getExistingViewCount();
            files.forEach((file) => updateReadme(file, totalViews));
            fs.writeFileSync('metrics.json', `${JSON.stringify({ repository, refresh_date: today, count: totalViews, uniques: traffic?.uniques ?? null, views: traffic?.views ?? [] }, null, 2)}\n`);
            console.log(`Updated ${files.join(', ')} with ${totalViews} total views.`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Commit private metadata updates
        if: github.event.repository.private
        env:
          PUSH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add README.md profile/README.md metrics.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update repository metadata"
          git push

      - name: Create public metadata pull request
        if: ${{ !github.event.repository.private }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          commit-message: "chore: update repository metadata"
          title: "chore: update repository metadata"
          body: "Automated refresh of the repository footer metadata."
          branch: automation/repository-metadata
          delete-branch: true
          add-paths: |
            README.md
            profile/README.md
            metrics.json